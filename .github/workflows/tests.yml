# Builds the core, extension and selector and runs the offline tests
# (docs/architecture.md#tests) on every push to main and on pull requests.
# On macOS, as the tests' host harnesses expect (BSD sockets, Homebrew's
# llvm@18), on an Intel runner: the harnesses run the console's x86-64 code,
# and under Rosetta on the arm64 runners about half the runs failed at random
# (a SIGBUS running freshly written code, a harness that stopped answering).
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install LLVM 18, Lua and the optional Python modules
        run: |
          brew install llvm@18 lua@5.4
          echo "$(brew --prefix lua@5.4)/bin" >> "$GITHUB_PATH"
          python -m pip install --upgrade pip
          python -m pip install pillow capstone

      - name: Check the tools
        run: lua -v && "$(brew --prefix llvm@18)/bin/clang" --version | head -1

      - name: Fetch the build inputs
        run: sh tools/fetch_deps.sh

      - name: Build
        run: make -C ghostldr/native -j"$(sysctl -n hw.ncpu)" LLVM="$(brew --prefix llvm@18)/bin"

      - name: Test
        run: python -m unittest discover -s ghostldr/tests -v
